name: lint

on:
  push:
    branches: [main, develop, dev, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: "0.11.0"
  # GitHub's recorded digest of shellcheck-v0.11.0.linux.x86_64.tar.xz
  SHELLCHECK_SHA256: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

jobs:
  scripts:
    name: shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # scriptcheck resolves its file list through git ls-files
      - name: Confirm a git checkout
        run: git rev-parse --is-inside-work-tree

      # The runner image ships 0.9.0 and a working copy may have anything else.
      # Versions disagree on which checks fire, so an unpinned tool makes the
      # gate a property of the image rather than of the scripts.
      - name: Install the pinned shellcheck
        run: |
          url=https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" "$url"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSION/shellcheck" /usr/local/bin/shellcheck

      # Both lint targets skip when shellcheck is missing, which would report
      # success having read nothing
      - name: Confirm the pinned version is the one on PATH
        run: |
          shellcheck --version
          shellcheck --version | grep -qx "version: $SHELLCHECK_VERSION"

      - name: Lint the build scripts
        run: make scriptcheck

      - name: Lint the embedded run script
        run: make runcheck
