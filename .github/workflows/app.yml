name: app

# Starts on every PR and every push to main, develop, dev and release/**, so the "app gate"
# job below always reports: it is the check a branch rule can require. The scope job decides whether the
# change is docs-only (.github/docs-only-paths); if so the build and checks jobs are
# skipped and the gate passes. scripts/build-local.sh reuses a run for a release only when
# those two jobs ran and succeeded on a push run (scripts/ci-run-passed.sh), so keep their names.
on:
  push:
    branches: [main, develop, dev, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR replaces the run, so a feature commit and the
# release bump pushed right after it don't hold the macOS runners twice. A release still
# finds a passing run: build-local.sh accepts one on the bump commit (only version.h
# differs). Every manual run has a group of its own and is never cancelled.
concurrency:
  group: app-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  DOBBY_COMMIT: "5dfc8546954ce3b3198132ab13fddb89ee92cdd7"
  FONT_TOOLS: "afdko==4.0.3 fonttools==4.66.1"
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"

jobs:
  scope:
    name: change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2

      - name: Decide whether the change is docs-only
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: sh scripts/ci-scope.sh | tee -a "$GITHUB_OUTPUT"

  build:
    name: full app build
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Record the toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app
          xcodebuild -version
          swift --version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"

      - name: Clone Dobby at the pinned commit
        run: |
          git clone --no-checkout https://github.com/jmpews/Dobby.git vendor/dobby
          git -C vendor/dobby checkout $DOBBY_COMMIT

      - name: Restore Dobby build cache
        id: dobby-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/dobby
          key: dobby-xcode-27-${{ env.DOBBY_COMMIT }}-${{ runner.arch }}

      - name: Build Dobby
        if: steps.dobby-cache.outputs.cache-hit != 'true'
        run: make dobby

      - name: Build the dylib
        run: make all

      - name: Build the overlay shim
        run: make overlay-shim

      - name: Build helpers
        run: make iconmaker appinfo

      # The five files app-payload stages from the Wine build (BRIDGE_FILES). A hit skips
      # the cross compilers, the Wine trees and the bridge build.
      # CEILING: the key hashes the bridge sources, not the Makefile recipe or brew's
      # mingw version — bump the "v1" if either changes what the bridge build produces.
      - name: Restore the built bridge
        id: bridge-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            scratch/wine-build-dual/programs/steam.exe/x86_64-windows/steam.exe
            scratch/wine-build-dual/dlls/lsteamclient/x86_64-windows/lsteamclient.dll
            scratch/wine-build-dual/dlls/lsteamclient/lsteamclient.so
            scratch/wine-build-dual/dlls/lsteamclient/i386-windows/lsteamclient.dll
            scratch/wine-build-arm64/dlls/lsteamclient/lsteamclient.so
          key: bridge-v1-xcode-27-${{ hashFiles('bridge/**', 'lsteamclient/**', 'steam-shim/**') }}

      - name: Install cross compilers
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        run: brew install mingw-w64 bison flex

      - name: Restore the Wine trees
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        id: wine-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            scratch/wine
            scratch/wine-build-dual
            scratch/wine-build-arm64
          key: wine-xcode-27-${{ hashFiles('bridge/setup-wine-tree.sh', 'bridge/register-components.diff') }}

      - name: Restore Proton tarball cache
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: scratch/proton-lsc
          key: proton-tarball-${{ hashFiles('lsteamclient/fetch.sh') }}

      - name: Build the bridge
        if: steps.bridge-cache.outputs.cache-hit != 'true'
        run: make bridge

      - name: Save the Wine trees
        if: steps.bridge-cache.outputs.cache-hit != 'true' && steps.wine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            scratch/wine
            scratch/wine-build-dual
            scratch/wine-build-arm64
          key: wine-xcode-27-${{ hashFiles('bridge/setup-wine-tree.sh', 'bridge/register-components.diff') }}

      - name: Restore the built fonts
        id: fonts-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/fonts
          key: fonts-v1-${{ hashFiles('fonts/**') }}-${{ env.FONT_TOOLS }}

      - name: Install font tools
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: |
          brew install fontforge gpatch
          python3 -m venv scratch/fontvenv
          scratch/fontvenv/bin/pip install $FONT_TOOLS
          echo "$PWD/scratch/fontvenv/bin" >> "$GITHUB_PATH"

      - name: Build the fonts
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: make fonts

      - name: Stage the app payload
        run: make app-payload

      - name: Build the app
        run: make app

      # The checks job runs the rest of the one check list (make ci-checks).
      - name: Run the checks that need the built app
        run: make ci-checks-built

      - name: Package the native installer
        run: make native-installer

      - name: Package the app bundle
        run: |
          mkdir -p out/artifact
          ditto -c -k --keepParent out/Bridgeplay.app out/artifact/Bridgeplay.zip
          cp out/Bridgeplay-Setup.zip out/artifact/

      - name: Upload the app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Bridgeplay
          path: out/artifact

  checks:
    name: source checks
    needs: scope
    if: needs.scope.outputs.docs_only != 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.0.app

      # Each check builds what it needs; none reads the app build.
      - name: Run the checks
        run: make ci-checks-source

  # The one check a branch rule requires. always(): a skipped required check counts as
  # passing, so a gate skipped because build or checks failed or were cancelled would let
  # the change in. scripts/ci-gate.sh says what is green.
  gate:
    name: app gate
    needs: [scope, build, checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check the verdict
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          DOCS_ONLY: ${{ needs.scope.outputs.docs_only }}
          BUILD_RESULT: ${{ needs.build.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: sh scripts/ci-gate.sh
