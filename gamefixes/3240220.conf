# Grand Theft Auto V Enhanced (3240220)
# Evidence: issue #3263 (WineCX 11.17, no gamefix): the Rockstar Games Launcher stops at "Failed to
# initialize launcher". Enhanced starts through the same launcher as GTA V Legacy, whose fix
# (gamefixes/271590.conf, tested 2026-11-01) is the same keys: the launcher's Direct2D needs DXVK,
# and ROCKSTAR_SHIM=1 makes its CEF windows draw. The shim swaps dxgi only in GTA5.exe, so
# GTA5_Enhanced.exe (D3D12) keeps D3DMetal's d3d12 and dxgi, which dxvk leaves builtin. Not run
# here: the test account does not own the game.
# -nobattleye starts the game without BattlEye: story mode only, GTA Online needs BattlEye.
BACKEND=dxvk
ROCKSTAR_SHIM=1
ARGS=-nobattleye
