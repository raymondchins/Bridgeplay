# Grand Theft Auto: San Andreas - The Definitive Edition (1547000)
# Same Rockstar launcher and DXVK/D3DMetal dxgi split as GTA V Legacy (gamefixes/271590.conf): the
# launcher needs DXVK, and the game's D3DMetal dxgi crashes creating its swapchain on DXVK's d3d11.
# ROCKSTAR_SHIM=1 (rockstar-shim/) makes the launcher's CEF windows draw, and on dxvk stages DXVK's
# dxgi as dxgi.dll beside SanAndreas.exe (Gameface/Binaries/Win64), which imports dxgi.dll statically.
# Startup was tested by hand with that dxgi.dll (PR #2315); the automatic staging and play are not.
BACKEND=dxvk
ROCKSTAR_SHIM=1
