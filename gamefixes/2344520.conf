# Diablo IV (2344520)
# Evidence: issue #3559 (WineCX 11.17, d3dmetal, Apple M4, macOS 27.2.1): with NVAPI=1 from
# gamefixes-default/default.conf the game crashed at random and warned of an unsupported driver for
# the RTX 4090 that NVAPI=1 reports; with NVAPI=0 the reporter played without a crash. NVAPI=0
# also leaves the adapter as Apple's, so the game offers no DLSS.
NVAPI=0
