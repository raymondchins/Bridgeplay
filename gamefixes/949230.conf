# Cities: Skylines II (949230)
# Steam starts the Paradox launcher (Launcher/dowser.exe), which fails under Wine. Started
# directly, Cities2.exe runs: 3 of 11 such reports Doesn't run, against 7 of 9 through the
# launcher. The direct launch is from a player report (#1415, compat/games.json) that used a
# sh -c launch option; this conf does the same. Untested here: mods subscribed in the launcher.
EXE_FROM=dowser.exe
EXE=Cities2.exe
