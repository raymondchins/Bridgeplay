# Car Parking Multiplayer 2 (4252340)
# Bukti: uji jalan pada WineCX 11.17 + DXMT, Apple M3, macOS 27.2.1 (26B131), 2026-11-26.
# UnityPlayer.dll memakai proteksi VMProtect dengan instruksi syscall langsung `int 0x2e`
# (`cd 2e`) yang memicu crash 0xc0000142 di Wine macOS tanpa int2e-shim.
# D3DMetal belum mengimplementasikan ID3D11Multithread (E_NOINTERFACE 0x80004002), yang
# membuat antrean render D3D11 membeku, sehingga game membutuhkan DXMT.
BACKEND=dxmt
INT2E_SHIM=1
