# Granado Espada (663090)
# Evidence: test run on WineCX 11.17, Apple M4, macOS 27.2, 2026-11-16 (Discussion #3728). The game is
# D3D9 and builds its world vertex shaders with ID3DXFragmentLinker, which Wine's d3dx9 only stubs, so
# the Create A Family hall drew stretched copies of the menus. The game ships Microsoft's D3DX9_41.dll
# in release/; with it the hall renders. ",b" falls back to Wine's d3dx9_41 if that file is missing.
DLLOVERRIDES=d3dx9_41=n,b
