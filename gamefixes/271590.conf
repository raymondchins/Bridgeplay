# Grand Theft Auto V Legacy (271590)
# Evidence: test run on WineCX 11.17, Apple M2, macOS 27.2, 2026-11-01. The Rockstar Games Launcher's
# Direct2D needs DXGID3D10CreateDevice, which D3DMetal's dxgi lacks ("failed to initialize"); DXMT
# crashes it and wined3d fails the same way, so the game runs on DXVK. ROCKSTAR_SHIM=1 (rockstar-shim/)
# makes the launcher's CEF windows draw and hands GTA5.exe DXVK's dxgi.
# BattlEye (GTA5_BE.exe) needs a Windows kernel driver and stops at "Updating...". -nobattleye starts
# GTA5.exe without it: story mode only, GTA Online needs BattlEye.
BACKEND=dxvk
ROCKSTAR_SHIM=1
ARGS=-nobattleye
