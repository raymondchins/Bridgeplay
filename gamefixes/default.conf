# Bridgeplay's defaults for every game, the lowest layer: the user's Game Defaults
# (gamefixes/default.conf), per-game confs and Steam launch options all win over these.
# Metal HUD, High Resolution (RETINA) and DLSS frame generation (DLSS_FG) stay off: they cost
# GPU and heat, and frame generation can hang WindowServer (frankea/Whisky#231). Turn them on per
# game or on the Game Defaults page.
# Rosetta hides AVX/AVX2 unless asked; many games (Spider-Man 2 checks Launcher_CPUFeatureAVX2NotPresent) quit without it.
ROSETTA_ADVERTISE_AVX=1
# Exposes DLSS through MetalFX (D3DMetal); only takes effect when DLSS is switched on in the game.
D3DM_ENABLE_METALFX=1
# DLSS: turns on Apple's nvapi64 (and nvngx once the engine links it) on D3DMetal, so games offer DLSS (served by MetalFX).
NVAPI=1
